[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify's Next.js runtime is detected automatically.
# The plugin below pins it explicitly so ISR, middleware and image optimisation work.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
