[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Do NOT set `publish` and do NOT list the Next.js plugin here.
# Netlify detects Next.js and configures the runtime automatically.
# Setting publish = ".next" is a common cause of failed deploys.

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
